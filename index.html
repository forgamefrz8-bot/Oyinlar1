<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ipak yo‘li imperiyasi</title>
<style>
:root{--bg:#f3efe4;--fg:#1f1a10;--card:#fffdf6;--line:#dccfae;--ac:#0f766e;--gold:#a8680f;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1514;--fg:#eaf2ee;--card:#15211f;--line:#2a3d39;--ac:#2dd4bf;--gold:#fbbf24;--no:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d1514;--fg:#eaf2ee;--card:#15211f;--line:#2a3d39;--ac:#2dd4bf;--gold:#fbbf24;--no:#ff8a80}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;max-width:540px;margin-inline:auto;padding:10px 12px 90px;line-height:1.4}
h1{margin:6px 0;font-size:24px;text-align:center}h3{margin:14px 0 6px}h4{margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.sm{font-size:13px;opacity:.75}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600}
:root:not([data-theme="light"]) button{color:#06201d}
button:disabled{opacity:.35}
.btn{background:var(--ac);color:#fff;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600;text-decoration:none}
:root:not([data-theme="light"]) .btn{color:#06201d}
input,select{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);box-sizing:border-box;width:100%;margin:4px 0}
#start{text-align:center;padding-top:50px}
#start input{margin:14px 0;text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.top b{font-size:19px;color:var(--gold)}
.it{display:flex;align-items:center;gap:10px}.it .fl{flex:1}.em{font-size:34px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.sc{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px}
.sc small{font-size:10px}.empty{opacity:.35;border-style:dashed}
